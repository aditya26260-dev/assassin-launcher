name: Build debug APK

# Runs on every push so a real compile happens automatically - this
# project has never been built before, only written and manually
# reviewed, so the first few runs here are expected to surface real
# errors. That's the point of having this at all.
on:
  push:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's runners already have an Android SDK preinstalled, but
      # sdkmanager isn't on PATH in a plain shell step (confirmed by an
      # actual failed run: "sdkmanager: command not found", exit 127 -
      # not guessed). nttld/setup-ndk downloads/caches the NDK directly
      # and links it into the SDK Gradle already sees, sidestepping the
      # PATH problem and any future runner-image path changes.
      - name: Install NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27d
          link-to-sdk: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assassin-launcher-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-logs
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: ignore
